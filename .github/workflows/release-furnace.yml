name: Publish Furnace to GHCR

# Build the checked-out fork, not an upstream SGLang release.
# main publishes latest / latest-rocm720-mi30x; v* tags publish version-rocm720-mi30x.
# Every build also publishes sha-<full commit>-rocm720-mi30x.
on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furnace-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'm8than/furnace'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/m8than/furnace
    steps:
      - name: Checkout Furnace
        uses: actions/checkout@v4
        with:
          # setuptools-scm needs history/tags for the Python package version.
          fetch-depth: 0
          persist-credentials: false

      - name: Reclaim hosted-runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-,suffix=-rocm720-mi30x
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest-rocm720-mi30x,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,suffix=-rocm720-mi30x
          labels: |
            org.opencontainers.image.title=Furnace
            org.opencontainers.image.description=SGLang-based inference for AMD MI300/MI325 (ROCm 7.2, gfx942)
            org.opencontainers.image.source=https://github.com/m8than/furnace
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Furnace
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rocm.Dockerfile
          platforms: linux/amd64
          # Push directly from BuildKit; loading another copy exhausts runner disk.
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BRANCH_TYPE=local
            GPU_ARCH=gfx942-rocm720
            BUILD_TYPE=all
            MAX_JOBS=2
            AITER_COMMIT=456b92780c8b650c1e3e4b0fa1ca21f0d1fb363d
            TRITON_VERSION=3.6.0
            UBUNTU_MIRROR=https://archive.ubuntu.com
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-rocm720-mi30x
          # Only main updates the shared cache; tag/branch builds may read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache-rocm720-mi30x,mode=min', env.IMAGE) || '' }}

      - name: Record published image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Furnace image published'
            echo
            printf 'Digest: `%s@%s`\n\n' "$IMAGE" "$IMAGE_DIGEST"
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            echo
            echo 'Target: linux/amd64, ROCm 7.2, gfx942 (MI300/MI325).'
            echo 'The hosted runner builds the image without a GPU; GPU inference is not tested by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
